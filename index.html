    <title>Modlitební seznam</title>
    <style>
        :root {
            --bg-color: #e2bb7b;
            --card-bg: #fcf6ea;
            --text-color: #3e2723;
            --primary: #8c5226;
            --item-bg: #f2e0c1;
            --input-bg: #ffffff;
            --border-color: #d1b894;
            --modal-overlay: rgba(62, 39, 35, 0.6);
            --border-radius: 12px;
        }

        [data-theme="dark"] {
            --bg-color: #1a1816;
            --card-bg: #2a2622;
            --text-color: #e0d8c8;
            --primary: #b8865c;
            --item-bg: #36312c;
            --input-bg: #23201c;
            --border-color: #4a433d;
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        html, body {
            background-color: var(--bg-color);
            min-height: 100vh;
            margin: 0;
            overscroll-behavior-y: none;
            transition: background-color 0.3s;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            padding: calc(15px + env(safe-area-inset-top)) 15px calc(40px + env(safe-area-inset-bottom)) 15px;
            touch-action: manipulation;
        }

        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: var(--primary); margin: 0; font-size: 1.5rem; }
        .theme-btn { background-color: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; }
        .loader { display: none; text-align: center; padding: 10px; color: var(--primary); font-weight: bold; }
        .accordion { display: flex; flex-direction: column; gap: 15px; }
        .day-section { background-color: var(--card-bg); border-radius: var(--border-radius); box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }

        .day-header { padding: 15px 20px; font-size: 1.3rem; font-weight: bold; color: var(--primary); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .toggle-arrow { font-size: 0.9rem; transition: transform 0.3s; }

        .day-section.active .toggle-arrow { transform: rotate(180deg); }
        .day-section.active .day-header { border-bottom: 1px solid var(--border-color); }
        .day-content { display: none; padding: 20px; }
        .day-section.active .day-content { display: block; }

        .custom-checkbox { position: relative; width: 38px; height: 38px; cursor: pointer; display: block; }
        .custom-checkbox input { opacity: 0; width: 0; height: 0; }
        .checkmark { position: absolute; top: 0; left: 0; height: 100%; width: 100%; background-color: transparent; border: 2px solid var(--border-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }

        [data-theme="dark"] .checkmark { border-color: var(--primary); }
        .custom-checkbox input:checked ~ .checkmark { background-color: #e2bb7b; border-color: #e2bb7b; }
        .custom-checkbox input:checked ~ .checkmark::after { content: '🙏'; font-size: 20px; }

        .item-list { list-style-type: none; padding: 0; margin: 0 0 15px 0; }
        .item { background-color: var(--item-bg); margin-bottom: 10px; padding: 15px; border-radius: var(--border-radius); display: flex; justify-content: space-between; align-items: center; }
        .item-name { flex-grow: 1; font-size: 1.1rem; }
        .item-actions { display: flex; gap: 10px; }
        .icon-btn { background: none; border: none; font-size: 1.2rem; padding: 5px; color: var(--text-color); cursor: pointer; }
        .add-form { display: flex; gap: 10px; }
        .add-input { flex-grow: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--border-radius); background-color: var(--input-bg); color: var(--text-color); font-size: 1rem; }
        .btn { background-color: var(--primary); color: #ffffc7; border: none; padding: 12px 20px; border-radius: var(--border-radius); font-size: 1rem; font-weight: bold; }
        [data-theme="dark"] .btn { color: #1a1816; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--modal-overlay); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background-color: var(--card-bg); padding: 25px; border-radius: var(--border-radius); width: 100%; max-width: 400px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 1.8rem; color: var(--text-color); }
        textarea { width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: var(--border-radius); background-color: var(--input-bg); color: var(--text-color); margin-bottom: 15px; resize: vertical; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Modlitby</h1>
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌙 Noc</button>
    </div>

    <div id="loader" class="loader">Synchronizace...</div>
    <div class="accordion" id="app"></div>

    <div class="modal-overlay" id="noteModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="color: var(--primary); margin-top:0;">Název</h2>
            <textarea id="modal-notes" rows="6" placeholder="Tvé poznámky..."></textarea>
            <button class="btn" onclick="saveNotes()" style="width: 100%;">Uložit poznámky</button>
        </div>
    </div>

    <script>
        // ZDE MUSÍ BÝT TVÁ URL ADRESA Z GOOGLE APPS SCRIPTU:
        const WEB_APP_URL = 'https://script.google.com/macros/library/d/1DyJD32ssPsU35kXllq2wQA9w0GeS611Li73JsJ9BM2vWlr6M2wuPykpW/6';

        const daysOfWeek = ['Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota', 'Neděle'];
        let prayerData = {};
        daysOfWeek.forEach(day => { prayerData[day] = { isDone: false, items: [] }; });

        const themeBtn = document.getElementById('themeToggle');
        if (localStorage.getItem('prayerTheme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeBtn.textContent = '☀️ Den';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1816');
        }

        function toggleTheme() {
            const root = document.documentElement;
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (root.getAttribute('data-theme') === 'dark') {
                root.removeAttribute('data-theme');
                localStorage.setItem('prayerTheme', 'light');
                themeBtn.textContent = '🌙 Noc';
                metaTheme.setAttribute('content', '#e2bb7b');
            } else {
                root.setAttribute('data-theme', 'dark');
                localStorage.setItem('prayerTheme', 'dark');
                themeBtn.textContent = '☀️ Den';
                metaTheme.setAttribute('content', '#1a1816');
            }
        }

        let currentActiveItem = null;

        function renderApp() {
            const appContainer = document.getElementById('app');
            const openDays = Array.from(document.querySelectorAll('.day-section.active')).map(el => el.dataset.day);
            appContainer.innerHTML = '';

            daysOfWeek.forEach(day => {
                const dayObj = prayerData[day];
                const section = document.createElement('div');
                section.className = `day-section ${openDays.includes(day) ? 'active' : ''}`;
                section.dataset.day = day;

                let itemsHtml = dayObj.items.map(item => `
                    <li class="item">
                        <div class="item-name" onclick="openModal('${day}', '${item.id}')">
                            ${item.name} ${item.notes ? '📝' : ''}
                        </div>
                        <div class="item-actions">
                            <button class="icon-btn" onclick="deleteItem('${day}', '${item.id}')">🗑️</button>
                        </div>
                    </li>
                `).join('');

                const isChecked = dayObj.isDone ? 'checked' : '';

                section.innerHTML = `
                    <div class="day-header" onclick="toggleDay(this)">
                        <span>${day}</span>
                        <div class="header-right">
                            <label class="custom-checkbox" onclick="event.stopPropagation()">
                                <input type="checkbox" onchange="toggleDayDone('${day}', this.checked)" ${isChecked}>
                                <span class="checkmark"></span>
                            </label>
                            <span class="toggle-arrow">▼</span>
                        </div>
                    </div>
                    <div class="day-content">
                        <ul class="item-list">
                            ${itemsHtml}
                        </ul>
                        <div class="add-form">
                            <input type="text" class="add-input" id="input-${day}" placeholder="Přidat jméno...">
                            <button class="btn" onclick="addItem('${day}')">+</button>
                        </div>
                    </div>
                `;
                appContainer.appendChild(section);
            });
        }

        function toggleDay(headerElement) { headerElement.parentElement.classList.toggle('active'); }

        function toggleDayDone(day, isDone) {
            prayerData[day].isDone = isDone;
            saveDataToSheets();
        }

        function addItem(day) {
            const input = document.getElementById(`input-${day}`);
            const name = input.value.trim();
            if (name) {
                prayerData[day].items.push({ id: Date.now().toString(), name: name, notes: '' });
                renderApp();
                saveDataToSheets();
            }
        }

        function deleteItem(day, id) {
            if (confirm('Opravdu chceš smazat tuto položku?')) {
                prayerData[day].items = prayerData[day].items.filter(i => i.id !== id);
                renderApp();
                saveDataToSheets();
            }
        }

        const modal = document.getElementById('noteModal');
        const modalNotes = document.getElementById('modal-notes');

        function openModal(day, id) {
            const item = prayerData[day].items.find(i => i.id === id);
            if (item) {
                currentActiveItem = { day, id };
                document.getElementById('modal-title').textContent = item.name;
                modalNotes.value = item.notes || '';
                modal.style.display = 'flex';
            }
        }

        function closeModal() { modal.style.display = 'none'; currentActiveItem = null; }

        function saveNotes() {
            if (currentActiveItem) {
                const { day, id } = currentActiveItem;
                const itemIndex = prayerData[day].items.findIndex(i => i.id === id);
                if (itemIndex !== -1) {
                    prayerData[day].items[itemIndex].notes = modalNotes.value;
                    renderApp();
                    closeModal();
                    saveDataToSheets();
                }
            }
        }

        let userPin = localStorage.getItem('prayerAppPin');
        if (!userPin) {
            userPin = prompt("Zadej přístupový PIN pro načtení seznamu:");
            if (userPin) localStorage.setItem('prayerAppPin', userPin);
        }

        async function loadDataFromSheets() {
            // Pokus načíst lokální zálohu jako záchranu, pokud nemáš vyplněnou URL
            if(WEB_APP_URL === 'https://script.google.com/macros/library/d/1DyJD32ssPsU35kXllq2wQA9w0GeS611Li73JsJ9BM2vWlr6M2wuPykpW/6') {
                const cached = localStorage.getItem('prayerAppCache');
                if (cached) prayerData = JSON.parse(cached);
                return renderApp();
            }

            document.getElementById('loader').style.display = 'block';
            try {
                const response = await fetch(WEB_APP_URL + '?pin=' + encodeURIComponent(userPin));
                const data = await response.json();

                if (data.error) {
                    alert("Špatný PIN kód! Přístup odepřen.");
                    localStorage.removeItem('prayerAppPin');
                    location.reload();
                    return;
                }

                if (data && Object.keys(data).length > 0) {
                    prayerData = data;
                    localStorage.setItem('prayerAppCache', JSON.stringify(prayerData)); // Uloží čerstvou zálohu do mobilu
                }
                renderApp();
            } catch (error) {
                console.error("Chyba načítání, načítám z offline zálohy telefonu:", error);
                const cached = localStorage.getItem('prayerAppCache');
                if (cached) prayerData = JSON.parse(cached);
                renderApp();
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        async function saveDataToSheets() {
            // Nejdůležitější úprava: Data se VŽDY ihned uloží i lokálně na tvém Pixelu
            localStorage.setItem('prayerAppCache', JSON.stringify(prayerData));

            if(WEB_APP_URL === 'https://script.google.com/macros/library/d/1DyJD32ssPsU35kXllq2wQA9w0GeS611Li73JsJ9BM2vWlr6M2wuPykpW/6') return;

            document.getElementById('loader').style.display = 'block';
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ pin: userPin, data: prayerData }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
            } catch (error) {
                console.error("Nepodařilo se odeslat do Googlu. Data jsou uložena lokálně.", error);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        loadDataFromSheets();
    </script>
</body>
</html>
